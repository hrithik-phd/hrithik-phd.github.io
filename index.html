<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1216" id="metaTheme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PhD Command">
<title>PhD Command · Application Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1216; --surface:#171c23; --surface2:#202834; --line:#2a3340; --line2:#3a4655;
  --ink:#e9e6de; --body:#c9cfd6; --muted:#949eab; --dim:#5f6873;
  --amber:#e8b563; --red:#e0796a; --green:#7fc99a; --teal:#6cc0ac; --blue:#7bafe3;
  --eu:#dcc76a; --na:#7bafe3; --asia:#6cc0ac; --aus:#e39b7e;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.55);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.65);
  --r:12px;
}
html[data-theme="light"]{
  --bg:#f2f0e9; --surface:#fdfcf9; --surface2:#f0ede4; --line:#dfdacc; --line2:#c9c3b3;
  --ink:#20252c; --body:#39414b; --muted:#5e6a76; --dim:#9aa2ac;
  --amber:#a2711a; --red:#bf4b3c; --green:#25824f; --teal:#1e8672; --blue:#2c67ab;
  --eu:#95790f; --na:#2c67ab; --asia:#1e8672; --aus:#b25a32;
  --shadow:0 1px 2px rgba(60,50,20,.06),0 10px 30px -18px rgba(60,50,20,.18);
  --shadow-lg:0 24px 60px -24px rgba(60,50,20,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
textarea,input,select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea:focus,input:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
a{color:var(--blue)}
svg.ic{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
::selection{background:color-mix(in srgb,var(--amber) 30%,transparent)}

/* ---------- app shell ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.content{flex:1;min-width:0}
.wrap{max-width:1060px;margin:0 auto;padding:4px 14px 90px}

@media(min-width:960px){
  .side{display:flex;flex-direction:column;gap:4px;width:230px;flex-shrink:0;position:sticky;top:0;height:100vh;
    padding:18px 12px 16px;background:var(--surface);border-right:1px solid var(--line)}
  .wrap{padding:22px 28px 60px}
}
.brand{font-weight:700;letter-spacing:.4px;font-size:16px;padding:0 10px 14px}
.brand span{color:var(--amber)}
.snav{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);text-align:left;width:100%;transition:background .12s,color .12s}
.navbtn:hover{background:var(--surface2);color:var(--ink)}
.navbtn.on{background:color-mix(in srgb,var(--amber) 12%,transparent);color:var(--ink)}
.navbtn.on svg.ic{color:var(--amber)}
.navbadge{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--red);
  border:1px solid color-mix(in srgb,var(--red) 55%,transparent);border-radius:99px;padding:0 6px;line-height:16px}
.navbadge:empty{display:none}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.sideact{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--muted);width:100%;text-align:left}
.sideact:hover{background:var(--surface2);color:var(--ink)}
.sideact .kbd{margin-left:auto}
.kbd{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--bg)}

/* mobile header + bottom nav */
.mhead{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mhead .hbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.hacts{display:flex;align-items:center;gap:2px}
.iconbtn{padding:7px;border-radius:8px;color:var(--muted);display:inline-flex}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.syncdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--dim);flex-shrink:0}
.syncdot.ok{background:var(--green)} .syncdot.local{background:var(--amber)} .syncdot.err{background:var(--red)}
.mhead .syncdot{margin-right:8px}
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
.bottombar .navbtn{flex-direction:column;gap:3px;padding:6px 2px;font-size:9.5px;font-weight:600;border-radius:8px;flex:1;align-items:center;letter-spacing:.02em}
.bottombar .navbtn.on{background:none;color:var(--amber)}
.bottombar .navbadge{display:none}
.bottombar .navbtn.hasbadge{position:relative}
.bottombar .navbtn.hasbadge::after{content:"";position:absolute;top:4px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--red)}
@media(min-width:960px){.bottombar,.mhead{display:none}}

/* ---------- shared blocks ---------- */
h2{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.board{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.brow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:none}
.brow.warn{background:color-mix(in srgb,var(--amber) 7%,transparent)}
.brow.hot{background:color-mix(in srgb,var(--red) 8%,transparent)}
.tminus{font-family:var(--mono);font-size:13px;font-weight:600;min-width:56px;color:var(--green)}
.brow.warn .tminus{color:var(--amber)} .brow.hot .tminus{color:var(--red)}
.bwhat{flex:1;min-width:0}
.bwhat .l1{font-size:14px;font-weight:600;line-height:1.35}
.bwhat .l2{font-size:12px;color:var(--muted);font-family:var(--mono)}
.past{opacity:.42;text-decoration:line-through}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:border-color .15s,transform .1s}
.stat .n{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1}
.stat .t{font-size:12px;color:var(--muted);margin-top:6px}
.stat.amber .n{color:var(--amber)} .stat.red .n{color:var(--red)} .stat.green .n{color:var(--green)} .stat.blue .n{color:var(--blue)}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 12px;box-shadow:var(--shadow)}
.mini .row{display:flex;justify-content:space-between;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px;align-items:center;cursor:pointer;transition:background .12s}
.mini .row:last-child{border-bottom:none}
.mini .row:hover{background:var(--surface2)}
.mini .who{font-weight:600}
.mini .sub{color:var(--muted);font-size:12px}
.mini .ago{font-family:var(--mono);font-size:12px;color:var(--amber);white-space:nowrap}
.empty{color:var(--dim);font-size:13px;padding:16px;text-align:center}

/* today layout */
.tgrid{display:grid;gap:0 24px}
@media(min-width:900px){
  .tgrid{grid-template-columns:1.15fr .85fr;align-items:start}
  .tgrid>div>h2:first-child{margin-top:24px}
}

/* ---------- uni cards ---------- */
.ucard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--dim);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);transition:border-color .15s}
.ucard.eu{border-left-color:var(--eu)} .ucard.na{border-left-color:var(--na)}
.ucard.asia{border-left-color:var(--asia)} .ucard.aus{border-left-color:var(--aus)}
.uhead{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left}
.pri{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:34px}
.uname{flex:1;min-width:0}
.uname .n{font-weight:600;font-size:15px;line-height:1.3}
.uname .c{font-size:12px;color:var(--muted)}
.udots{display:flex;gap:3px;align-items:center;flex-wrap:wrap;max-width:120px;justify-content:flex-end}
.udot{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--dim) 55%,transparent)}
.udot.e{background:var(--amber)} .udot.r{background:var(--green)} .udot.x{background:var(--red)}
.uchev{color:var(--dim);font-size:11px;transition:transform .15s}
.ucard.open .uchev{transform:rotate(90deg)}
.ubody{display:none;border-top:1px solid var(--line);padding:14px}
.ucard.open .ubody{display:block}
.locnote{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.locnote b,.locnote strong{color:var(--ink)}
.secline{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px;font-weight:600}

/* ---------- professor cards ---------- */
.pgrid{display:grid;gap:10px;margin-top:4px}
@media(min-width:900px){.pgrid{grid-template-columns:1fr 1fr;align-items:start}}
.pgrid .pcard{margin-bottom:0}
.pcard{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px;transition:border-color .15s}
.pgrid>.pcard,#v-eccv .pcard{background:var(--surface);box-shadow:var(--shadow)}
.pcard.notecard{background:transparent;border-style:dashed;box-shadow:none}
.ptop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pstar{font-size:16px;color:var(--dim);padding:2px 4px;flex-shrink:0;line-height:1}
.pstar.on{color:var(--amber)}
.pstar:hover{color:var(--amber)}
.pname{font-weight:700;font-size:15px}
.puni{font-size:12px;color:var(--muted);font-weight:400}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.bdg{font-size:10.5px;font-weight:600;font-family:var(--mono);padding:2px 8px;border-radius:99px;border:1px solid}
.bdg.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 60%,transparent);background:color-mix(in srgb,var(--red) 8%,transparent)}
.bdg.amber{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 60%,transparent);background:color-mix(in srgb,var(--amber) 8%,transparent)}
.bdg.green{color:var(--green);border-color:color-mix(in srgb,var(--green) 60%,transparent);background:color-mix(in srgb,var(--green) 8%,transparent)}
.bdg.teal{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 60%,transparent);background:color-mix(in srgb,var(--teal) 8%,transparent)}
.bdg.grey{color:var(--muted);border-color:var(--line)}
.pstatus{font-size:12.5px;color:var(--amber);font-weight:600;margin-bottom:6px}
.stmt{font-size:13.5px;color:var(--body);white-space:pre-line}
.stmt.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{font-size:12px;color:var(--blue);margin-top:3px;padding:2px 0}
.contact{margin-top:8px;font-size:12.5px;background:var(--bg);border-radius:8px;padding:9px 11px;border:1px solid var(--line);color:var(--body)}
.contact b{font-size:10.5px;letter-spacing:.08em;color:var(--dim);display:block;text-transform:uppercase;margin-bottom:2px}
.src{font-size:11px;color:var(--dim);margin-top:6px;font-family:var(--mono);word-break:break-all}

/* pipeline stage buttons */
.pipe{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.stg{flex:1;min-width:60px;font-size:12px;font-weight:600;padding:7px 4px;border-radius:8px;border:1px solid var(--line);color:var(--muted);text-align:center;transition:border-color .12s,color .12s}
.stg:hover{border-color:var(--line2)}
.stg.hit{border-color:var(--amber);color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.stg.hit.g{border-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}
.stg.hit.r{border-color:var(--red);color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.sdate{font-family:var(--mono);font-size:10px;display:block;margin-top:2px;font-weight:400}
.noteta{margin-top:8px;min-height:38px;font-size:13px;resize:vertical}
.notelbl{font-size:11px;color:var(--dim);margin-top:8px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:8px}
.notelbl .savedhint{font-size:10px;color:var(--green);text-transform:none;letter-spacing:0;font-weight:600;opacity:0;transition:opacity .3s;font-family:var(--mono)}
.notelbl .savedhint.show{opacity:1}
.notesavebtn{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.notesavebtn:hover{color:var(--ink);border-color:var(--line2)}

/* ---------- kanban ---------- */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:min(268px,78vw);gap:12px;overflow-x:auto;padding:4px 2px 14px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.kcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 210px);min-height:180px;scroll-snap-align:start;box-shadow:var(--shadow)}
.kcol .khead{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.kcol .khead .kn{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:500}
.kcards{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
.kcard{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 28px 9px 10px;cursor:pointer;text-align:left;transition:border-color .12s}
.kcard:hover{border-color:var(--line2)}
.kcard.starred{border-color:color-mix(in srgb,var(--amber) 50%,var(--line))}
.kstar{position:absolute;top:5px;right:4px;font-size:14px;color:var(--dim);padding:3px 5px;line-height:1}
.kstar.on{color:var(--amber)}
.kcard .kn1{font-weight:600;font-size:13px;line-height:1.3}
.ktier{font-family:var(--mono);font-size:9px;font-weight:700;margin-left:5px;padding:0 4px;border-radius:4px;border:1px solid var(--line);color:var(--muted);vertical-align:1px}
.kcard .kn2{font-size:11.5px;color:var(--muted);margin-top:1px}
.kcard .kmeta{display:flex;align-items:center;gap:6px;margin-top:6px}
.kcard .kago{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.kcard .kago.late{color:var(--amber);font-weight:600}
.kadv{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.kadv:hover{color:var(--amber);border-color:var(--amber)}

/* ---------- filters ---------- */
.fbar{display:flex;gap:6px;overflow-x:auto;padding:12px 0 8px;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
@media(min-width:960px){.fbar{flex-wrap:wrap}}
.fbar::-webkit-scrollbar{display:none}
.fchip{white-space:nowrap;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface);transition:border-color .12s,color .12s}
.fchip:hover{border-color:var(--line2);color:var(--ink)}
.fchip.on{border-color:var(--amber);color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.sortsel{width:auto;flex-shrink:0;padding:6px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.sortsel:hover{border-color:var(--line2)}
.msel{position:relative;display:inline-flex;flex-shrink:0}
.mselbtn{display:inline-flex;align-items:center;gap:4px}
.mselpanel{position:fixed;z-index:60;width:min(280px,80vw);max-height:340px;display:flex;flex-direction:column;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:8px;box-shadow:var(--shadow-lg)}
.mselsearch{width:100%;box-sizing:border-box;margin-bottom:6px;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:12.5px}
.msellist{overflow-y:auto;flex:1;min-height:0}
.mseloption{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:12.5px;color:var(--body);cursor:pointer}
.mseloption:hover{background:var(--line)}
.mseloption input{width:auto;padding:0;flex-shrink:0}
.mselfoot{display:flex;justify-content:space-between;padding-top:6px;margin-top:4px;border-top:1px solid var(--line)}
.mselfoot button{font-size:11.5px;font-weight:600;color:var(--muted);padding:3px 6px}
.mselfoot button:hover{color:var(--ink)}
.search{margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
.count{font-size:12px;color:var(--dim);font-family:var(--mono);margin:10px 2px}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:rgba(8,10,13,.55);z-index:60;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
html[data-theme="light"] .modal{background:rgba(50,45,30,.35)}
.modal.open{display:flex}
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:20px 18px 34px;width:100%;max-width:780px;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
@media(min-width:700px){
  .modal{align-items:center;padding:24px}
  .sheet{border-radius:16px;max-width:620px;padding-bottom:22px}
}
.mclose{position:absolute;top:12px;right:12px;font-size:15px;color:var(--muted);padding:6px 9px;border-radius:8px}
.mclose:hover{color:var(--ink);background:var(--surface2)}
[data-pdetail]{cursor:pointer}
.pname[data-pdetail]:hover,.crow:hover .cn{text-decoration:underline;text-decoration-color:var(--dim)}
.brow[data-pdetail]{transition:background .15s}
.brow[data-pdetail]:hover{background:var(--surface2)}
.sheet h3{font-size:16px;margin-bottom:12px}
.sheet label{font-size:12px;color:var(--muted);display:block;margin:12px 0 4px}
.btnrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:9px;border:1px solid var(--line);color:var(--ink);background:var(--surface);transition:border-color .12s}
.btn:hover{border-color:var(--line2)}
.btn.primary{background:var(--amber);color:#1a1408;border-color:var(--amber)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,transparent)}
.hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-size:13px;padding:9px 16px;border-radius:99px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--shadow-lg);white-space:nowrap}
@media(min-width:960px){.toast{bottom:24px}}
.toast.show{opacity:1}

/* ---------- command palette ---------- */
.cmdk{align-items:flex-start;padding:12vh 14px 14px}
.cmdsheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);overflow:hidden}
.cmdsheet input{border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:14px 16px;font-size:15px}
.cmdsheet input:focus{outline:none}
.cmdlist{max-height:min(400px,50vh);overflow-y:auto;padding:6px}
.cmditem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-size:13.5px}
.cmditem.sel,.cmditem:hover{background:var(--surface2)}
.cmditem .ct{font-family:var(--mono);font-size:9.5px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--dim);min-width:38px;text-align:center;flex-shrink:0}
.cmditem.sel .ct{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 55%,transparent)}
.cmditem .cl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmditem .cs2{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;padding-left:10px;flex-shrink:1}
.cmdfoot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}

/* ---------- progress ---------- */
.progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.ptop2{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.ptop2 b{font-family:var(--mono);font-size:16px}
.pbar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;display:flex;margin-top:9px}
.pbar i{display:block;height:100%}
.plegend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--muted)}
.plegend b{font-family:var(--mono);color:var(--ink)}
.dotk{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:baseline;flex-shrink:0}

/* ---------- uni info grid + application status ---------- */
.uinfo{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;background:var(--surface2);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.uinfo b{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;white-space:nowrap;padding-top:1px}
.uinfo span{color:var(--body);word-break:break-word}
.appchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.appc{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted);transition:border-color .12s,color .12s}
.appc:hover{border-color:var(--line2)}
.appc.on{border-color:var(--blue);color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.apptag{font-size:10px;font-weight:700;font-family:var(--mono);padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--blue) 13%,transparent);color:var(--blue);white-space:nowrap}
.appc.g.on{border-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}
.apptag.doctag{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}

/* ---------- dates form ---------- */
.dform{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px;box-shadow:var(--shadow)}
.dform .frow{display:flex;gap:8px;margin-bottom:8px}
.delx{color:var(--red);font-size:14px;padding:4px 8px;opacity:.65}
.delx:hover{opacity:1}

/* ---------- follow-up + compact rows ---------- */
.fubtn{font-size:12px;font-weight:600;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 60%,transparent);border-radius:99px;padding:5px 12px;margin-top:10px}
.fubtn:hover{background:color-mix(in srgb,var(--amber) 10%,transparent)}
.fuline{font-size:11px;color:var(--dim);font-family:var(--mono);margin-left:10px}
.crow{display:flex;align-items:center;width:100%;text-align:left;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px;background:var(--surface);transition:background .12s}
.crow:last-child{border-bottom:none}
.crow:hover{background:var(--surface2)}
.crow .cn{font-weight:600;white-space:nowrap}
.crow .cu{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.crow .cs{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---------- eccv ---------- */
.prio{font-family:var(--mono);font-weight:700;font-size:11px;border-radius:6px;padding:2px 8px;border:1px solid;flex-shrink:0}
.prio.S{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 60%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.prio.A{color:var(--green);border-color:color-mix(in srgb,var(--green) 60%,transparent);background:color-mix(in srgb,var(--green) 10%,transparent)}
.prio.B{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 60%,transparent);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.prio.C{color:var(--muted);border-color:var(--line)}
.epaper{font-size:12.5px;color:var(--body);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:7px}
.esess{display:block;font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:2px}
.star{font-size:16px;color:var(--dim);padding:2px 6px;flex-shrink:0}
.star.on{color:var(--amber)}

/* ---------- links, locations, inline email copy ---------- */
.plinks{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px;align-items:center}
.lwho{font-size:11px;color:var(--dim);font-weight:600;margin:0 2px 0 4px}
.lwho:first-child{margin-left:0}
.lchip{font-size:11px;font-weight:600;font-family:var(--mono);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--blue);text-decoration:none;background:color-mix(in srgb,var(--blue) 5%,transparent);white-space:nowrap}
.lchip:hover{border-color:color-mix(in srgb,var(--blue) 60%,transparent)}
.ltopics{font-size:12px;color:var(--muted);margin:0 0 7px}
.ltopics b{color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.06em}
.contchip{font-size:9px;font-weight:700;font-family:var(--mono);padding:1px 5px;border-radius:4px;border:1px solid;vertical-align:1px;white-space:nowrap}
.contchip.eu{color:var(--eu);border-color:color-mix(in srgb,var(--eu) 55%,transparent)}
.contchip.na{color:var(--na);border-color:color-mix(in srgb,var(--na) 55%,transparent)}
.contchip.asia{color:var(--asia);border-color:color-mix(in srgb,var(--asia) 55%,transparent)}
.contchip.aus{color:var(--aus);border-color:color-mix(in srgb,var(--aus) 55%,transparent)}
.puni2{font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.elink{color:var(--blue);padding:0;font-family:var(--mono);font-size:.95em;border-bottom:1px dashed color-mix(in srgb,var(--blue) 45%,transparent);word-break:break-all;text-align:left}
.elink::after{content:" ⧉";font-size:.85em;opacity:.7}
.stmt a,.contact a,.locnote a,.src a{color:var(--blue);word-break:break-all}
.epaper a{color:inherit;text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--blue) 45%,transparent)}
.epaper a:hover{color:var(--blue)}

/* ---------- collaboration-cluster warning (co-authors at same institution) ---------- */
.cluster{background:var(--surface);border:1px solid var(--teal);border-left:3px solid var(--teal);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.cluster .chead{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.04em;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cluster .crole{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid var(--teal);color:var(--teal)}
.cluster .cmembers{font-size:12.5px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.cluster .cmembers b{color:var(--ink);font-weight:600}
.cluster .cguide{font-size:13px;color:var(--body);line-height:1.55;margin-top:6px}
.cluster .cguide b{color:var(--ink);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;color:var(--dim)}

/* ---------- drafted outreach emails ---------- */
.edraft{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.edraft.guidance{border-left:3px solid var(--amber)}
.edraft.email{border-left:3px solid var(--blue)}
.ekind{font-size:10px;font-weight:700;font-family:var(--mono);letter-spacing:.08em;padding:2px 8px;border-radius:5px;display:inline-block}
.ekind.email{color:var(--blue);background:color-mix(in srgb,var(--blue) 13%,transparent)}
.ekind.guidance{color:var(--amber);background:color-mix(in srgb,var(--amber) 13%,transparent)}
.ehook{font-size:12.5px;color:var(--muted);margin:8px 0;line-height:1.5}
.esubj{font-size:13.5px;font-weight:700;margin-top:8px}
.ebody{font-size:13px;color:var(--body);white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px;line-height:1.55}
.enote{font-size:13px;color:var(--body);background:var(--surface2);border-radius:8px;padding:10px 12px;margin-top:8px;line-height:1.55}
.eacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* hover polish */
.ucard:hover,.stat:hover,.pgrid>.pcard:hover{border-color:var(--line2)}
.stat:active{transform:scale(.98)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
"use strict";
const D = window.PHD_DATA;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const uniById = {}; D.universities.forEach(u=>uniById[u.id]=u);
const profsByUni = {}; D.professors.forEach(p=>{(profsByUni[p.uniId]=profsByUni[p.uniId]||[]).push(p)});
const STAGES = [["emailed","Emailed"],["replied","Replied"],["interview","Interview"],["offer","Offer"],["rejected","No / Rej."]];
const STAGE_ORDER = {emailed:1,replied:2,interview:3,offer:4,rejected:4};
const APP_STAGES = [["prep","Preparing"],["submitted","Submitted"],["interview","Interview"],["offer","Offer"],["rejected","Rejected"]];
const APP_LBL = Object.fromEntries(APP_STAGES);
const APP_RANK = {offer:6,interview:5,submitted:4,prep:3,rejected:1};
const DOCS = [["sop","SOP"],["cv","CV"],["lor1","LoR 1"],["lor2","LoR 2"],["lor3","LoR 3"],["transcripts","Transcripts"],["fee","Fee paid"]];

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $("#metaTheme").content = t==="light" ? "#f2f0e9" : "#0f1216";
  $$("[data-theme-label]").forEach(el=>el.textContent = t==="light"?"Dark mode":"Light mode");
}
let theme = localStorage.getItem("phdTheme") || "dark";
applyTheme(theme);
document.addEventListener("click",e=>{
  if(e.target.closest("[data-theme-toggle]")){
    theme = theme==="light"?"dark":"light";
    localStorage.setItem("phdTheme",theme); applyTheme(theme);
  }
});

/* ---------- state ---------- */
let state = {profs:{}, unis:{}, dates:{}, v:1};
function loadLocal(){ try{const s=localStorage.getItem("phdState"); if(s) state=JSON.parse(s);}catch(e){} if(!state.dates) state.dates={}; }
function saveLocal(){ localStorage.setItem("phdState", JSON.stringify(state)); }
function pstate(id){ return state.profs[id] || (state.profs[id]={stage:null,dates:{},notes:"",ts:0}); }
function ustate(id){ return state.unis[id] || (state.unis[id]={notes:"",app:null,ts:0}); }
function touch(o){ o.ts = Date.now(); saveLocal(); queueSync(); }

/* ---------- sync ---------- */
const cfg = {url: localStorage.getItem("phdWorkerUrl")||"", tok: localStorage.getItem("phdWorkerTok")||""};
let syncTimer=null, syncState="local";
function setDot(s){
  syncState=s;
  $$(".syncdot").forEach(d=>d.className="syncdot "+(s==="ok"?"ok":s==="err"?"err":"local"));
  const lbl=$("#syncLabel");
  if(lbl) lbl.textContent = !cfg.url ? "Offline — this device only" : (s==="ok"?"Synced":s==="err"?"Sync error — check settings":"Local changes pending");
}
function mergeStates(a,b){ // entity-wise last-write-wins
  const out={profs:{...a.profs},unis:{...a.unis},dates:{...(a.dates||{})},v:1};
  for(const k in b.profs){ if(!out.profs[k]||(b.profs[k].ts||0)>(out.profs[k].ts||0)) out.profs[k]=b.profs[k]; }
  for(const k in b.unis){ if(!out.unis[k]||(b.unis[k].ts||0)>(out.unis[k].ts||0)) out.unis[k]=b.unis[k]; }
  for(const k in (b.dates||{})){ if(!out.dates[k]||(b.dates[k].ts||0)>(out.dates[k].ts||0)) out.dates[k]=b.dates[k]; }
  return out;
}
async function pullMergePush(showToast){
  if(!cfg.url||!cfg.tok){ setDot("local"); return; }
  try{
    const r = await fetch(cfg.url,{headers:{"X-Auth-Token":cfg.tok}});
    if(!r.ok) throw new Error("GET "+r.status);
    const remote = await r.json();
    if(remote && remote.profs) state = mergeStates(remote, state);
    saveLocal();
    const w = await fetch(cfg.url,{method:"PUT",headers:{"X-Auth-Token":cfg.tok,"Content-Type":"application/json"},body:JSON.stringify(state)});
    if(!w.ok) throw new Error("PUT "+w.status);
    setDot("ok"); if(showToast) toast("Synced");
    render();
  }catch(e){ setDot("err"); if(showToast) toast("Sync failed — check URL/token"); }
}
async function pushNow(){

/* linkify runs on already-escaped text: emails become copy buttons,
   URLs (full or bare like werkenbij.uva.nl/en/phd) become new-tab links */
const TLD_RE = "com|org|net|edu|gov|io|ai|ch|de|nl|uk|ca|au|nz|sg|hk|cn|jp|kr|tw|fr|it|se|dk|fi|no|at|be|es|pt|il|in|cz|pl|gr|ie|ae|sa|qa|my|xyz|dev|info|eu";
function linkify(html){
  html = html.replace(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g,
    m=>`<button class="elink" data-copy="${m}" title="Copy email address">${m}</button>`);
  html = html.replace(/https?:\/\/[^\s<>"']+/g, m=>{
    const t=m.replace(/[.,;:)\]]+$/,""); const rest=m.slice(t.length);
    return `<a href="${t}" target="_blank" rel="noopener">${t}</a>${rest}`;
  });
  html = html.replace(new RegExp("(^|[\\s(])((?:[a-z0-9-]+\\.)+(?:"+TLD_RE+")\\b(?:/[^\\s<>\"')]*)?)","gi"), (m,pre,dom)=>{
    const t=dom.replace(/[.,;:)\]]+$/,""); const rest=dom.slice(t.length);
    return `${pre}<a href="https://${t}" target="_blank" rel="noopener">${t}</a>${rest}`;
  });
  return html;
}

function allDeadlines(){

function uniKeyNorm(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z ]/g," ")
    .replace(/\b(the|of|at|in|university|univ|institute|institution|technology|tech|school|college)\b/g,"")

function sortProfs(list, sort){
  if(!sort) return list;
  const arr=[...list];
  if(sort==="method") arr.sort((a,b)=>APP_METHOD_ORDER.indexOf(appMethod(a))-APP_METHOD_ORDER.indexOf(appMethod(b))||a.uniPriority-b.uniPriority);
  else if(sort==="stage") arr.sort((a,b)=>(STAGE_ORDER[pstate(b.id).stage]||0)-(STAGE_ORDER[pstate(a.id).stage]||0)||a.uniPriority-b.uniPriority);
  else if(sort==="name") arr.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==="uni") arr.sort((a,b)=>a.uniName.localeCompare(b.uniName)||a.name.localeCompare(b.name));
  else if(sort==="activity"){ const act=p=>(state.profs[p.id]||{}).ts||0; arr.sort((a,b)=>act(b)-act(a)); }
  return arr;
}
const CLUSTER_CHIPS = [["has","🔗 Has cluster"],["primary","🔗 Email first"],["wait","🔗 Wait"]];
function clusterMatch(p, mode){
  const c = clusterFor(p);
  if(!c) return false;
  if(mode==="has") return true;
  const isPrimary = nameKey(c.primary)===nameKey(p.name);
  return mode==="primary" ? isPrimary : !isPrimary;
}

const KCOLS = [
  [null,"Not contacted","var(--dim)"],
  ["emailed","Emailed","var(--amber)"],
  ["replied","Replied","var(--teal)"],
  ["interview","Interview","var(--blue)"],
  ["offer","Offer","var(--green)"],
  ["rejected","No / Rejected","var(--red)"],
];
const KNEXT = {null:"emailed",emailed:"replied",replied:"interview",interview:"offer"};
const KNEXT_LBL = {null:"Emailed",emailed:"Replied",replied:"Interview",interview:"Offer"};
let kFilters = {q:"",uni:new Set(),uniOpen:false,uniQ:"",cont:"",starOnly:false};
function renderPipeline(){
  registerMsel("k", kFilters, renderPipeline);
  let real = D.professors.filter(p=>!p.flags.note);
  if(kFilters.uni.size) real=real.filter(p=>kFilters.uni.has(p.uniId));
  if(kFilters.cont) real=real.filter(p=>uniById[p.uniId]&&uniById[p.uniId].continent===kFilters.cont);
  if(kFilters.starOnly) real=real.filter(p=>pstate(p.id).star);
  if(kFilters.q){ const q=kFilters.q.toLowerCase();
    real = real.filter(p=>(p.name+" "+p.uniName).toLowerCase().includes(q)); }
  const cols = KCOLS.map(([stage,label,color])=>{
    let list = real.filter(p=>pstate(p.id).stage===stage);
    list.sort((a,b)=>{
      const as=pstate(a.id).star?1:0, bs=pstate(b.id).star?1:0;
      if(as!==bs) return bs-as; // starred always first
      const at=profPriorityTier(a), bt=profPriorityTier(b);
      if(at!==bt) return bt-at; // then ECCV S>A>B>C tier (untiered profs last)
      if(stage==="emailed"){ const d=lastPing(pstate(a.id))-lastPing(pstate(b.id)); if(d!==0) return d; }
      return a.uniPriority-b.uniPriority; // then school priority
    });
    const cards = list.map(p=>{
      const ps=pstate(p.id);
      const t = stage&&ps.dates[stage] ? ps.dates[stage] : 0;
      const silent = stage==="emailed" ? daysAgo(lastPing(ps)) : null;
      const next = KNEXT[stage];
      const uni=uniById[p.uniId];
      const tier=profPriorityTier(p);
      return `<div class="kcard${ps.star?" starred":""}" data-pdetail="${p.id}">
        <button class="kstar${ps.star?" on":""}" data-star="${p.id}" aria-label="Star">${ps.star?"★":"☆"}</button>
        <div class="kn1">${esc(p.name)}${tier?`<span class="ktier">${{4:"S",3:"A",2:"B",1:"C"}[tier]}</span>`:""}</div>

        ${papersHtml(e,p.id)}

/* ---------- render + events ---------- */
const VIEWS = ["today","schools","people","pipeline","dates","eccv"];
let view="today";
function setView(v){ view=v; try{ localStorage.setItem("phdView", v); }catch(e){} }
/* remember scroll position per tab so a reload restores where you were, not just the tab */
let scrollSaveTimer=null, restoringScroll=false;
function saveScroll(){
  if(restoringScroll) return; // ignore scroll events fired by our own restore-in-progress
  try{
    const s = JSON.parse(localStorage.getItem("phdScroll")||"{}");
    s[view] = window.scrollY;
    localStorage.setItem("phdScroll", JSON.stringify(s));
  }catch(e){}
}
function getSavedScroll(v){
  try{ return (JSON.parse(localStorage.getItem("phdScroll")||"{}"))[v] || 0; }catch(e){ return 0; }
}
function restoreScroll(v){
  // web-font swap / late reflow can grow page height a moment after first paint, clamping an
  // early scrollTo back to 0 — keep re-asserting the target across several frames to outlast that.
  restoringScroll = true;
  const target = getSavedScroll(v);
  let tries = 0;
  const attempt = ()=>{
    window.scrollTo(0, target);
    tries++;
    if(tries<8) requestAnimationFrame(attempt); else setTimeout(()=>{restoringScroll=false;},60);
  };
  requestAnimationFrame(attempt);
}
window.addEventListener("scroll",()=>{ clearTimeout(scrollSaveTimer); scrollSaveTimer=setTimeout(saveScroll,200); },{passive:true});
window.addEventListener("beforeunload",saveScroll);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveScroll(); });
function updateNavBadges(){
  const n = overdueProfs().length;
  $$("[data-badge]").forEach(el=>el.textContent = n? String(n):"");
  $$("[data-mobile-badge]").forEach(el=>el.classList.toggle("hasbadge", n>0));
}
function render(){
  VIEWS.forEach(v=>{$("#v-"+v).hidden = v!==view;});
  $$(".navbtn").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  if(view==="today") renderToday();
  if(view==="schools") renderSchools();
  if(view==="people") renderPeople();
  if(view==="pipeline") renderPipeline();
  if(view==="dates") renderDates();
  if(view==="eccv") renderEccv();
  updateNavBadges();
}

document.addEventListener("click",e=>{
  if(!e.target.closest(".msel")){
    let closedAny=false;
    [pFilters,eFilters,kFilters,dFilters].forEach(f=>{ if(f.uniOpen){ f.uniOpen=false; closedAny=true; } });
    if(closedAny){
      if(view==="people") renderPeople();
      else if(view==="eccv") renderEccv();
      else if(view==="pipeline") renderPipeline();
      else if(view==="dates") renderDates();
    }
  }
  const t = e.target.closest("[data-v],[data-uni],[data-stg],[data-more],[data-go],[data-chip],[data-app],[data-cont],[data-sx],[data-deldate],[data-copy],[data-fu],[data-doc],[data-compact],[data-pdetail],[data-pmclose],[data-sort],[data-eccv],[data-morepapers],[data-eprio],[data-econt],[data-estat],[data-edraft],[data-oview],[data-savenote],[data-saveunote],[data-star],[data-mseltoggle],[data-mseluni],[data-mselclear],[data-mselcls],[data-pstage],[data-pcluster],[data-pstaronly],[data-ecluster],[data-estaronly],[data-kcont],[data-kstaronly]");
  if(!t) return;
  if(t.dataset.v){ setView(t.dataset.v); render(); window.scrollTo(0,0); }
  else if(t.dataset.uni){ const id=t.dataset.uni; openUnis.has(id)?openUnis.delete(id):openUnis.add(id); $("#uc-"+id).classList.toggle("open"); }
  else if(t.dataset.stg){
    const ps=pstate(t.dataset.p); const stg=t.dataset.stg;
    if(ps.stage===stg){ ps.stage = stg==="emailed"?null:Object.keys(STAGE_ORDER).find(k=>STAGE_ORDER[k]===STAGE_ORDER[stg]-1)||null; }
    else { ps.stage=stg; if(!ps.dates[stg]) ps.dates[stg]=Date.now(); }
    touch(ps);
    // re-render current view but keep scroll
    const y=window.scrollY; render(); window.scrollTo(0,y); renderProfModal();
  }
  else if(t.dataset.more){ const el=$("#st-"+t.dataset.more); el.classList.toggle("clip"); t.textContent=el.classList.contains("clip")?"show full":"collapse"; }
  else if(t.dataset.go){ setView(t.dataset.go); if(t.dataset.preset){pFilters.preset=t.dataset.preset;} render(); window.scrollTo(0,0); }
  else if(t.dataset.chip){ const c=t.dataset.chip; pFilters.chips.has(c)?pFilters.chips.delete(c):pFilters.chips.add(c); renderPeople(); }
  else if(t.dataset.app){
    const us=ustate(t.dataset.u); us.app = us.app===t.dataset.app?null:t.dataset.app; touch(us);
    const y=window.scrollY; render(); window.scrollTo(0,y);
  }
  else if(t.dataset.cont){ sFilters.cont = sFilters.cont===t.dataset.cont?"":t.dataset.cont; renderSchools(); }
  else if(t.dataset.sort){ sFilters.sort = sFilters.sort===t.dataset.sort?"":t.dataset.sort; renderSchools(); }
  else if(t.dataset.sx){ if(t.dataset.sx==="open") sVisible.forEach(id=>openUnis.add(id)); else openUnis.clear(); renderSchools(); }
  else if(t.dataset.fu){ const ps=pstate(t.dataset.fu); (ps.fu=ps.fu||[]).push(Date.now()); touch(ps); const y=window.scrollY; render(); window.scrollTo(0,y); renderProfModal(); toast("Follow-up logged — clock reset"); }
  else if(t.dataset.doc){ const us=ustate(t.dataset.u); us.docs=us.docs||{}; us.docs[t.dataset.doc]=!us.docs[t.dataset.doc]; touch(us); const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(t.dataset.compact){ pFilters.compact=!pFilters.compact; renderPeople(); }
  else if(t.dataset.eccv){ const ps=pstate(t.dataset.eccv); ps.eccv = ps.eccv===t.dataset.est?null:t.dataset.est; touch(ps); const y=window.scrollY; render(); window.scrollTo(0,y); renderProfModal(); }
  else if(t.dataset.eprio){ eFilters.prio = eFilters.prio===t.dataset.eprio?"":t.dataset.eprio; renderEccv(); }
  else if(t.dataset.econt){ eFilters.cont = eFilters.cont===t.dataset.econt?"":t.dataset.econt; renderEccv(); }
  else if(t.dataset.estat){ eFilters.stat = eFilters.stat===t.dataset.estat?"":t.dataset.estat; renderEccv(); }
  else if(t.dataset.edraft){ eFilters.draft = eFilters.draft===t.dataset.edraft?"":t.dataset.edraft; renderEccv(); }
  else if(t.dataset.oview){ eFilters.oview = t.dataset.oview; renderEccv(); }
  else if(t.dataset.savenote){ const ps=pstate(t.dataset.savenote); touch(ps); pushNow(); flashSavedHint(t); toast("Note saved"); }
  else if(t.dataset.saveunote){ const us=ustate(t.dataset.saveunote); touch(us); pushNow(); flashSavedHint(t); toast("Note saved"); }
  else if(t.dataset.star){ const ps=pstate(t.dataset.star); ps.star=!ps.star; touch(ps); const y=window.scrollY; render(); window.scrollTo(0,y); renderProfModal(); }
  else if(t.dataset.morepapers){ const id=t.dataset.morepapers; eccvPapersOpen.has(id)?eccvPapersOpen.delete(id):eccvPapersOpen.add(id); const y=window.scrollY; if(view==="eccv") renderEccv(); window.scrollTo(0,y); renderProfModal(); }
  else if(t.dataset.pdetail){ openProfModal(t.dataset.pdetail); }
  else if(t.dataset.pmclose){ closeProfModal(); }
  else if(t.dataset.deldate){ const d=state.dates[t.dataset.deldate]; if(d){ d.del=true; touch(d); renderDates(); toast("Date removed"); } }
  else if(t.dataset.copy){
    navigator.clipboard.writeText(t.dataset.copy)
      .then(()=>toast("Copied: "+t.dataset.copy))
      .catch(()=>toast("Copy failed"));
  }
  else if(t.dataset.mseltoggle){
    const prefix = t.dataset.mseltoggle;
    const [filters,rerender] = MSEL_REGISTRY[prefix];
    const opening = !filters.uniOpen;
    [pFilters,eFilters,kFilters,dFilters].forEach(f=>f.uniOpen=false);
    filters.uniOpen = opening;
    rerender();
  }
  else if(t.dataset.mseluni){
    const [prefix,uniId] = t.dataset.mseluni.split(":");
    const [filters,rerender] = MSEL_REGISTRY[prefix];
    filters.uni.has(uniId) ? filters.uni.delete(uniId) : filters.uni.add(uniId);
    rerender();
  }
  else if(t.dataset.mselclear){
    const [filters,rerender] = MSEL_REGISTRY[t.dataset.mselclear];
    filters.uni.clear(); rerender();
  }
  else if(t.dataset.mselcls){
    const [filters,rerender] = MSEL_REGISTRY[t.dataset.mselcls];
    filters.uniOpen=false; rerender();
  }
  else if(t.dataset.pstage){ pFilters.stage = pFilters.stage===t.dataset.pstage?"":t.dataset.pstage; renderPeople(); }
  else if(t.dataset.pcluster){ pFilters.cluster = pFilters.cluster===t.dataset.pcluster?"":t.dataset.pcluster; renderPeople(); }
  else if(t.dataset.pstaronly){ pFilters.starOnly = !pFilters.starOnly; renderPeople(); }
  else if(t.dataset.ecluster){ eFilters.cluster = eFilters.cluster===t.dataset.ecluster?"":t.dataset.ecluster; renderEccv(); }
  else if(t.dataset.estaronly){ eFilters.starOnly = !eFilters.starOnly; renderEccv(); }
  else if(t.dataset.kcont){ kFilters.cont = kFilters.cont===t.dataset.kcont?"":t.dataset.kcont; renderPipeline(); }
  else if(t.dataset.kstaronly){ kFilters.starOnly = !kFilters.starOnly; renderPipeline(); }
});
function flashSavedHint(fromEl){
  const notelbl = fromEl.classList.contains("noteta") ? fromEl.previousElementSibling : fromEl.closest(".notelbl");
  const hint = notelbl ? notelbl.querySelector(".savedhint") : null;
  if(!hint) return;
  hint.classList.add("show");
  clearTimeout(hint._t); hint._t = setTimeout(()=>hint.classList.remove("show"), 1400);
}
document.addEventListener("input",e=>{
  if(e.target.dataset.note){ const ps=pstate(e.target.dataset.note); ps.notes=e.target.value; touch(ps); flashSavedHint(e.target); }
  if(e.target.dataset.unote){ const us=ustate(e.target.dataset.unote); us.notes=e.target.value; touch(us); flashSavedHint(e.target); }
});

/* ---------- command palette ---------- */
let cmdSel=0, cmdItems=[];
function cmdCandidates(){
  const items=[];
  VIEWS.forEach((v,i)=>items.push({t:"view",id:v,title:"Go to "+({today:"Today",schools:"Schools",people:"People",pipeline:"Pipeline",dates:"Dates",eccv:"ECCV"})[v],sub:"tab · "+(i+1),hay:"go to tab view "+v}));
  D.professors.filter(p=>!p.flags.note).forEach(p=>{
    const s=pstate(p.id).stage;
    items.push({t:"prof",id:p.id,title:p.name,sub:p.uniName+(s?" · "+s:""),hay:(p.name+" "+p.uniName).toLowerCase()});
  });
  D.universities.forEach(u=>items.push({t:"uni",id:u.id,title:u.name,sub:(u.city?u.city+", ":"")+u.country,hay:(u.name+" "+u.city+" "+u.country+" "+(u.program||"")).toLowerCase()}));
  allDeadlines().filter(d=>d.dl>=-30).forEach(d=>items.push({t:"dl",id:d.dlid,title:d.label,sub:d.date+(d.uni?" · "+d.uni:""),hay:(d.label+" "+(d.uni||"")+" deadline").toLowerCase()}));
  return items;
}
function cmdFilter(q){
  const all=cmdCandidates();
  if(!q){
    // default: tabs + most urgent follow-ups + next deadlines
    const urgent = overdueProfs().slice(0,3).map(p=>({t:"prof",id:p.id,title:p.name,sub:p.uniName+" · "+daysAgo(lastPing(pstate(p.id)))+"d silent"}));
    const next = allDeadlines().filter(d=>d.dl>=0).slice(0,3).map(d=>({t:"dl",id:d.dlid,title:d.label,sub:"T−"+d.dl+"d · "+d.date}));
    return all.filter(i=>i.t==="view").concat(urgent,next);
  }
  q=q.toLowerCase().trim();
  const scored=[];
  for(const it of all){
    if(it.t==="view" && !it.hay.includes(q)) continue;
    const hay=it.hay||"";
    const idx=hay.indexOf(q);
    if(idx<0) continue;
    const starts = it.title.toLowerCase().startsWith(q) ? 0 : (idx===0?1:2);
    scored.push([starts,idx,it]);
  }
  scored.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  return scored.slice(0,10).map(x=>x[2]);
}
function cmdRender(){
  const q=$("#cmdInput").value;
  cmdItems=cmdFilter(q);
  if(cmdSel>=cmdItems.length) cmdSel=Math.max(0,cmdItems.length-1);
  const tag={view:"TAB",prof:"PROF",uni:"SCHOOL",dl:"DATE"};
  $("#cmdList").innerHTML = cmdItems.map((it,i)=>
    `<button class="cmditem${i===cmdSel?" sel":""}" data-cmdi="${i}">
      <span class="ct">${tag[it.t]}</span><span class="cl">${esc(it.title)}</span><span class="cs2">${esc(it.sub||"")}</span>
    </button>`).join("") || '<div class="empty">No matches.</div>';
}
function cmdOpen(){ cmdSel=0; $("#cmdk").classList.add("open"); const i=$("#cmdInput"); i.value=""; cmdRender(); setTimeout(()=>i.focus(),0); }
function cmdClose(){ $("#cmdk").classList.remove("open"); }
function cmdGo(it){
  if(!it) return;
  cmdClose();
  if(it.t==="view"){ setView(it.id); render(); window.scrollTo(0,0); }
  else if(it.t==="prof"){ openProfModal(it.id); }
  else if(it.t==="dl"){ openProfModal("dl-"+it.id); }
  else if(it.t==="uni"){
    setView("schools"); sFilters={q:"",cont:"",sort:""}; openUnis.add(it.id); render();
    const el=$("#uc-"+it.id); if(el) el.scrollIntoView({block:"start",behavior:"instant"});
    window.scrollBy(0,-70);
  }
}
$("#cmdInput").addEventListener("input",()=>{cmdSel=0; cmdRender();});
$("#cmdInput").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); cmdSel=Math.min(cmdSel+1,cmdItems.length-1); cmdRender(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); cmdSel=Math.max(cmdSel-1,0); cmdRender(); }
  else if(e.key==="Enter"){ e.preventDefault(); cmdGo(cmdItems[cmdSel]); }
});
$("#cmdList").addEventListener("click",e=>{
  const b=e.target.closest("[data-cmdi]"); if(b) cmdGo(cmdItems[+b.dataset.cmdi]);
});
$("#cmdk").addEventListener("click",e=>{ if(e.target.id==="cmdk") cmdClose(); });
$$("[data-open-cmdk]").forEach(b=>b.addEventListener("click",cmdOpen));

/* ---------- keyboard shortcuts ---------- */
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("#cmdk").classList.contains("open")?cmdClose():cmdOpen(); return; }
  if(e.key==="Escape"){
    if($("#cmdk").classList.contains("open")) return cmdClose();
    if($("#profModal").classList.contains("open")) return closeProfModal();
    if($("#settings").classList.contains("open")) return $("#settings").classList.remove("open");
    return;
  }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName||"");
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key==="/"){ e.preventDefault(); cmdOpen(); return; }
  const n=parseInt(e.key,10);
  if(n>=1 && n<=VIEWS.length){ setView(VIEWS[n-1]); render(); window.scrollTo(0,0); }
});

/* ---------- settings ---------- */
$$("[data-open-settings]").forEach(b=>b.addEventListener("click",()=>{
  $("#setUrl").value=cfg.url; $("#setTok").value=cfg.tok;
  $("#syncInfo").textContent = cfg.url?`Configured. Status: ${syncState}`:"Not configured — offline mode.";
  $("#settings").classList.add("open");
}));
$("#closeSet").onclick=()=>$("#settings").classList.remove("open");
$("#settings").addEventListener("click",e=>{if(e.target.id==="settings")$("#settings").classList.remove("open");});
$("#profModal").addEventListener("click",e=>{if(e.target.id==="profModal")closeProfModal();});
$("#saveSet").onclick=()=>{
  cfg.url=$("#setUrl").value.trim().replace(/\/$/,""); cfg.tok=$("#setTok").value.trim();
  localStorage.setItem("phdWorkerUrl",cfg.url); localStorage.setItem("phdWorkerTok",cfg.tok);
  $("#settings").classList.remove("open"); pullMergePush(true);
};
$("#exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="phd-tracker-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(!j||typeof j!=="object"||!j.profs) throw new Error("bad shape");
      state=mergeStates(state,{profs:j.profs||{},unis:j.unis||{},dates:j.dates||{}});
      saveLocal(); queueSync(); render(); toast("Backup imported & merged");
    }catch(err){ toast("Invalid backup file"); }
  };
  r.readAsText(f); e.target.value="";
};
$("#wipeBtn").onclick=()=>{ if(confirm("Erase all tracking data on this device? (Remote KV copy is untouched)")){ localStorage.removeItem("phdState"); state={profs:{},unis:{},dates:{},v:1}; render(); toast("Local data cleared"); } };

/* ---------- boot ---------- */
try{ const savedView=localStorage.getItem("phdView"); if(savedView && VIEWS.includes(savedView)) view=savedView; }catch(e){}
loadLocal(); render(); setDot("local"); pullMergePush(false);
restoreScroll(view);
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
